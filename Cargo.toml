[workspace]
resolver = "2"
members = [
    "crates/weaver-config",
    "crates/weaver-cli",
    "crates/weaver-core",
    "crates/weaver-crypto",
    "crates/weaver-discovery",
    "crates/weaver-net",
    "crates/weaver-net-sim",
    "crates/weaver-relay",
    "crates/weaver-relay-core",
    "crates/weaver-store",
    "examples/tonic-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
aes-gcm = "0.10"
async-stream = "0.3"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "=0.11.0"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "=3.0.0"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.0.3", default-features = false, features = ["server", "tls-ring"] }
n0-future = "=0.3.2"
netdev = "=0.45.0"
prost = "0.14"
redb = "=4.2.0"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swarm-discovery = "=0.6.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.14.2"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1"
